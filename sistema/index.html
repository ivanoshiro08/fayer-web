<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistema Fayer — Control financiero</title>
<meta name="description" content="Sistema de control financiero para PyMEs y finanzas personales.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF8F6" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  color-scheme:dark;
  --bg:#131110; --bg-deep:#0D0B0A; --surface:#1A1715; --raised:#221E1B;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --text:#F4F0EC; --muted:#9A9086; --dim:#6E655D;
  --accent:#FF4D00; --accent-2:#FF8A4C; --accent-ink:#FFFFFF;
  --ok:#4BAE7E; --warn:#E8B64C; --bad:#E5574D;
  --glass:rgba(26,23,21,.82); --inset:inset 0 1px 0 rgba(255,255,255,.07);
  --shadow:0 32px 80px -24px rgba(0,0,0,.72);
  --grid-line:rgba(255,255,255,.045);
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Instrument Sans","Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#FAF8F6; --bg-deep:#F1ECE7; --surface:#FFFFFF; --raised:#F4EFEA;
    --line:rgba(24,17,12,.11); --line-2:rgba(24,17,12,.21);
    --text:#191411; --muted:#6E6259; --dim:#948A81;
    --accent:#DE4200; --accent-2:#A83200;
    --ok:#2F8A5E; --warn:#9C6D15; --bad:#C0342B;
    --glass:rgba(255,255,255,.86); --inset:inset 0 1px 0 rgba(255,255,255,.9);
    --shadow:0 32px 70px -28px rgba(60,38,20,.26);
    --grid-line:rgba(24,17,12,.05);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FAF8F6; --bg-deep:#F1ECE7; --surface:#FFFFFF; --raised:#F4EFEA;
  --line:rgba(24,17,12,.11); --line-2:rgba(24,17,12,.21);
  --text:#191411; --muted:#6E6259; --dim:#948A81;
  --accent:#DE4200; --accent-2:#A83200;
  --ok:#2F8A5E; --warn:#9C6D15; --bad:#C0342B;
  --glass:rgba(255,255,255,.86); --inset:inset 0 1px 0 rgba(255,255,255,.9);
  --shadow:0 32px 70px -28px rgba(60,38,20,.26);
  --grid-line:rgba(24,17,12,.05);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--ok)} .neg{color:var(--bad)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.025em;line-height:1.14;text-wrap:balance}
p{margin:0}

/* ───────────────────────────────────────────────────────────────── GATE ── */
.gate-screen{min-height:100svh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 620px at 70% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%),var(--bg)}
.gate-box{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:26px;
  padding:2rem 1.8rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1rem;align-items:center;text-align:center}
.gate-box .mark{width:46px;height:46px}
.gate-box h1{font-size:1.5rem;font-weight:800}
.gate-box p{font-size:.88rem;color:var(--muted);max-width:33ch}
.gate-row{display:flex;gap:.45rem;width:100%}
.gate-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:13px;
  padding:.68rem .9rem;font-family:var(--f-mono);font-size:.86rem;letter-spacing:.05em;text-transform:uppercase}
.gate-row input:focus{outline:none;border-color:var(--accent)}
.gate-msg{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;min-height:1em}
.gate-msg.err{color:var(--bad)} .gate-msg.ok{color:var(--ok)}
.gate-foot{font-size:.76rem;color:var(--dim);border-top:1px solid var(--line);padding-top:.9rem;width:100%}
.gate-foot a{color:var(--accent);text-decoration:none}

/* ─────────────────────────────────────────────────────────────── BOTONES ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.55rem 1.05rem;border-radius:999px;
  font-size:.86rem;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:transform .4s var(--ease),background .4s var(--ease),border-color .4s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-1{background:var(--accent);color:var(--accent-ink)}
.btn-1:hover{background:var(--accent-2);transform:translateY(-1px)}
.btn-2:hover{transform:translateY(-1px)}
.btn-2{background:var(--raised);border-color:var(--line-2)} .btn-2:hover{border-color:var(--accent)}
.btn-3{background:none;border-color:transparent;color:var(--muted);padding:.4rem .6rem} .btn-3:hover{color:var(--text)}
.btn-bad{background:none;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn-bad:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn-sm{padding:.34rem .7rem;font-size:.78rem}
.icb{width:32px;height:32px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--raised);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 32px;transition:color .4s var(--ease)}
.icb{transition:color .4s var(--ease),transform .4s var(--ease),border-color .4s var(--ease)}
.icb:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}

/* ───────────────────────────────────────────────────────────────── SHELL ── */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.8rem;padding:.7rem clamp(14px,3vw,26px);
  padding-top:calc(.7rem + env(safe-area-inset-top,0px));
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.04em}
.topbar .brand svg{width:20px;height:20px;flex:0 0 20px}
.emp{font-size:.82rem;color:var(--muted);border-left:1px solid var(--line);padding-left:.8rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.spacer{flex:1}
.saved{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.dest{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:.26rem .6rem;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);
  background:var(--raised);cursor:pointer;transition:border-color .4s var(--ease),color .4s var(--ease)}
.dest:hover{border-color:var(--accent);color:var(--text)}
.dest b{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block}
.dest.on b{background:var(--ok)}
.aviso{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;justify-content:space-between;
  margin-bottom:clamp(16px,2vw,22px);padding:.7rem 1rem;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:.84rem}
.modo-pick{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.modo-pick button{text-align:left;padding:1.1rem;border-radius:18px;border:1px solid var(--line-2);background:var(--bg);
  cursor:pointer;display:flex;flex-direction:column;gap:.3rem;transition:border-color .4s var(--ease),transform .4s var(--ease)}
.modo-pick button:hover{border-color:var(--accent);transform:translateY(-2px)}
.modo-pick b{font-family:var(--f-display);font-size:1rem;font-weight:700}
.modo-pick span{font-size:.8rem;color:var(--muted);line-height:1.45}
@media (max-width:640px){.modo-pick{grid-template-columns:1fr}}

.tabs{position:sticky;top:0;z-index:30;display:flex;gap:2px;overflow-x:auto;padding:.5rem clamp(14px,3vw,26px);
  background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.44rem .85rem;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;
  font-size:.83rem;color:var(--muted);white-space:nowrap;transition:color .35s var(--ease),background .35s var(--ease)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--raised);border-color:var(--line-2);color:var(--text);font-weight:600}

main{padding:clamp(18px,3vw,30px) clamp(14px,3vw,26px) 80px;max-width:1360px;margin-inline:auto}
.view{display:flex;flex-direction:column;gap:clamp(16px,2vw,22px)}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.9rem}
.vhead h2{font-size:clamp(1.35rem,2.4vw,1.85rem);font-weight:800}
.vhead p{font-size:.86rem;color:var(--muted);max-width:60ch;margin-top:.25rem}
.tools{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--inset);
  transition:border-color .45s var(--ease)}
.card:hover{border-color:var(--line-2)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.7rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--line)}
.card-h h3{font-size:.95rem;font-weight:600}
.card-h .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card-b{padding:1.1rem}

/* ──────────────────────────────────────────────────────────────── KPI ──── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.4vw,14px)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.05rem 1.1rem;
  display:flex;flex-direction:column;gap:.3rem;box-shadow:var(--inset);
  transition:transform .45s var(--ease),border-color .45s var(--ease)}
.kpi:hover{transform:translateY(-3px);border-color:var(--line-2)}
.kpi span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.kpi b{font-family:var(--f-mono);font-size:clamp(1.15rem,2.1vw,1.6rem);font-weight:700;letter-spacing:-.035em}
.kpi small{font-size:.76rem;color:var(--muted)}

.sem{display:grid;gap:.5rem}
.sem-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .85rem;
  border-radius:13px;border:1px solid var(--line);background:var(--bg);
  transition:border-color .4s var(--ease),transform .4s var(--ease)}
.sem-row:hover{border-color:var(--line-2);transform:translateX(3px)}
.sem-row span{font-size:.85rem}
.pill{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:.24rem .58rem;
  border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,transparent);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,transparent);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:color-mix(in srgb,var(--warn) 11%,transparent)}
.pill.mut{color:var(--dim);border-color:var(--line-2)}

.bars{display:flex;align-items:stretch;gap:5px;height:164px}
.bars .b{flex:1;display:grid;grid-template-rows:1fr 1fr auto;height:100%}
.bars .b .u{display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line-2)}
.bars .b .d{display:flex;align-items:flex-start;justify-content:center}
.bars .b{cursor:default}
.bars .b i{display:block;width:62%;transform-origin:center;
  transition:height .6s var(--ease),filter .3s var(--ease),transform .3s var(--ease)}
.bars .b:hover i{filter:brightness(1.22);transform:scaleX(1.18)}
.bars .b:hover span{color:var(--text)}
.bars .b span{transition:color .3s var(--ease)}
.bars .b .u i{background:var(--accent);border-radius:4px 4px 0 0}
.bars .b .d i{background:var(--bad);border-radius:0 0 4px 4px}
.bars .b span{font-family:var(--f-mono);font-size:8.5px;color:var(--dim);text-align:center;padding-top:.35rem}

.two{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(12px,1.6vw,18px);align-items:start}

/* ───────────────────────────────────────────────────────────────── TABLA ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px}
th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  font-weight:500;text-align:left;padding:.65rem 1.1rem;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:.6rem 1.1rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .3s var(--ease),box-shadow .3s var(--ease)}
tbody tr:hover{background:var(--bg);box-shadow:inset 2px 0 0 var(--accent)}
tbody tr .row-act .btn{opacity:.5;transition:opacity .3s var(--ease),color .3s var(--ease)}
tbody tr:hover .row-act .btn{opacity:1}
th.r,td.r{text-align:right}
td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:700;font-family:var(--f-mono);background:var(--bg)}
.row-act{display:flex;gap:.2rem;justify-content:flex-end}
.empty{padding:2.6rem 1.1rem;text-align:center;color:var(--muted);font-size:.87rem}
.empty b{display:block;font-family:var(--f-display);font-size:1rem;color:var(--text);margin-bottom:.3rem}

/* ────────────────────────────────────────────────────────────── CONTROLES ─ */
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:.55rem .8rem;font-size:.87rem}
.inp:focus{outline:none;border-color:var(--accent)}
select.inp{cursor:pointer}
.fld{display:flex;flex-direction:column;gap:.32rem}
.fld label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.fld .hint{font-size:.74rem;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.full{grid-column:1/-1}
.filters{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.filters .inp{width:auto;min-width:130px}

.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .5rem .3rem .7rem;border-radius:999px;
  border:1px solid var(--line-2);background:var(--bg);font-size:.8rem}
.chip{transition:border-color .35s var(--ease),transform .35s var(--ease)}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip button{border:0;background:none;color:var(--dim);cursor:pointer;padding:0 .1rem;line-height:1;font-size:1rem;
  transition:color .25s var(--ease),transform .25s var(--ease)}
.chip button:hover{transform:scale(1.25)}
.chip button:hover{color:var(--bad)}

/* ───────────────────────────────────────────────────────────────── MODAL ── */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-box{width:min(620px,100%);max-height:88svh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);
  border-radius:24px;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{font-size:1.05rem;font-weight:700}
.modal-b{padding:1.3rem;display:flex;flex-direction:column;gap:.85rem}
.modal-f{display:flex;gap:.5rem;justify-content:flex-end;padding:1rem 1.3rem;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120%);z-index:90;
  background:var(--raised);border:1px solid var(--line-2);border-radius:999px;padding:.6rem 1.2rem;font-size:.85rem;
  box-shadow:var(--shadow);transition:transform .5s var(--ease);max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0)}

.note{font-size:.8rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  border-left:2px solid var(--accent);border-radius:0 12px 12px 0;padding:.75rem .95rem;line-height:1.55}

/* flujo de caja */
.flow{min-width:1000px}
.flow td:first-child,.flow th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.flow tbody tr:hover td:first-child{background:var(--bg)}
.flow .sec td{background:var(--bg-deep);font-family:var(--f-display);font-weight:600;font-size:.8rem;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.flow .tot td{font-weight:700;border-top:1px solid var(--line-2);background:var(--bg)}
.flow .fin td{font-weight:700;background:color-mix(in srgb,var(--accent) 9%,transparent)}

@media (max-width:1080px){ .kpis{grid-template-columns:1fr 1fr} .two{grid-template-columns:1fr} }
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .emp{display:none}
  .vhead{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ───────────────────────────────────────────────────────────────── PRINT ── */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .topbar,.tabs,main,#toast,.modal{display:none!important}
  #print{display:block!important;padding:0;font-size:11pt}
  #print h1{font-size:19pt;margin-bottom:2pt}
  #print h2{font-size:12pt;margin:16pt 0 5pt;border-bottom:1px solid #999;padding-bottom:3pt}
  #print table{min-width:0;font-size:9.5pt}
  #print th,#print td{padding:3pt 6pt;border-bottom:1px solid #ddd;color:#000}
  #print .meta{color:#555;font-size:9pt}
}
</style>

<!-- ══════════════════════════════════════════════════════════════ GATE ══ -->
<div class="gate-screen" id="gate">
  <div class="gate-box">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1.2" y="1.2" width="21.6" height="21.6" rx="6.4" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
      <path d="M7 16.4V9.1M12 16.4V6.6M17 16.4v-4.6" stroke="#FF4D00" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1>Sistema Fayer</h1>
    <p>Control financiero para PyMEs. Ingresá el código que recibiste al comprar tu acceso.</p>
    <div class="gate-row">
      <input id="gcode" placeholder="FAYER-SIS-XXXX-XXXX" aria-label="Código de acceso" autocomplete="off" spellcheck="false">
      <button class="btn btn-1" id="gbtn" type="button">Entrar</button>
    </div>
    <span class="gate-msg" id="gmsg"></span>
    <div class="gate-foot">
      ¿Todavía no tenés acceso? <a href="https://fayer.site" target="_blank" rel="noopener">Conocé el sistema en fayer.site</a>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ APP ══ -->
<div id="app" hidden>
  <header class="topbar">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">

function sha(t){
  if(!(window.crypto && crypto.subtle)) return Promise.resolve(null);
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
  });
}

/* Los códigos son de un solo uso. Quien decide eso es el servidor: la función
   /api/canjear marca el código como canjeado la primera vez y devuelve un token.
   Si el sitio se abre sin backend (preview local), caemos a validación local. */
function probar(raw){
  var v = String(raw||"").trim().toUpperCase();
  if(!v) return;
  var http = location.protocol === "http:" || location.protocol === "https:";
  if(!http) return localCheck(v);          // preview local: sin backend
  gmsg("", "Verificando…");
  var ctrl = setTimeout(function(){ localCheck(v); }, 6000);
  fetch("/api/canjear", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({codigo:v, producto:"sistema", token: ls(TKEY) || ""})
  }).then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(d){
      clearTimeout(ctrl);
      if(d && d.ok){ ls(AKEY,"1"); ls(TKEY, d.token || "1"); gmsg("ok","Acceso habilitado"); abrir(); }
      else if(d && d.error === "usado"){ gmsg("err","Ese código ya fue canjeado"); }
      else { gmsg("err","Ese código no es válido"); }
    })
    .catch(function(){ clearTimeout(ctrl); localCheck(v); });
}
function localCheck(v){
  sha(v).then(function(h){
    if(h && SIS.indexOf(h) !== -1){ ls(AKEY,"1"); gmsg("ok","Acceso habilitado"); abrir(); }
    else gmsg("err","Ese código no es válido");
  });
}

function L(){ return MODOS[S.modo] || MODOS.pyme; }

function vacio(modo){

/* ── Archivo real en la computadora (File System Access API) ──────────────
   El navegador guarda en localStorage, que se borra si el usuario limpia los
   datos de navegación. Si además vinculamos un archivo, los datos viven en el
   disco del usuario y sobreviven a cualquier limpieza del navegador.        */
var fh = null;             // FileSystemFileHandle vinculado
var soportaFS = typeof window.showSaveFilePicker === "function";

function idb(){
  return new Promise(function(res, rej){
    var r = indexedDB.open("fayer-fs", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("h"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function hSet(h){
  return idb().then(function(db){ return new Promise(function(res, rej){
    var t = db.transaction("h","readwrite"); t.objectStore("h").put(h,"file");
    t.oncomplete = function(){ res(); }; t.onerror = function(){ rej(t.error); };
  });});
}
function hGet(){
  return idb().then(function(db){ return new Promise(function(res){
    var t = db.transaction("h","readonly"), q = t.objectStore("h").get("file");
    q.onsuccess = function(){ res(q.result || null); };
    q.onerror = function(){ res(null); };
  });}).catch(function(){ return null; });
}
function hDel(){
  return idb().then(function(db){ return new Promise(function(res){
    var t = db.transaction("h","readwrite"); t.objectStore("h").delete("file");
    t.oncomplete = function(){ res(); }; t.onerror = function(){ res(); };
  });}).catch(function(){});
}
function escribirArchivo(){
  if(!fh) return Promise.resolve(false);
  return fh.createWritable()
    .then(function(w){ return w.write(JSON.stringify(S, null, 1)).then(function(){ return w.close(); }); })
    .then(function(){ return true; })
    .catch(function(){ return false; });
}
function estadoDestino(){
  var n = $("#dest"); if(!n) return;
  n.className = "dest" + (fh ? " on" : "");
  n.innerHTML = '<b></b>' + (fh ? "Guarda en tu archivo" : "Solo en este navegador");
  n.title = fh ? "Los datos se escriben en el archivo que vinculaste."
               : "Los datos viven solo en este navegador. Vinculá un archivo desde la pestaña Datos.";
}
function vincular(){
  if(!soportaFS){
    return modal("Tu navegador no lo permite",
      '<p style="font-size:.88rem;color:var(--muted)">Guardar directo en un archivo de tu computadora funciona en Chrome, Edge y Opera de escritorio. ' +
      'En Firefox, Safari y en celulares el navegador no lo permite todavía.</p>' +
      '<div class="note">Mientras tanto, usá <b>Exportar copia</b> una vez por semana y guardá el archivo donde guardás el resto de tus papeles. ' +
      'Es el mismo resultado, solo que a mano.</div>',
      '<button class="btn btn-1" data-x>Entendido</button>');
  }
  var nom = "fayer-" + (S.empresa.nombre || S.modo).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + ".json";
  window.showSaveFilePicker({
    suggestedName: nom,
    types:[{description:"Datos de Fayer", accept:{"application/json":[".json"]}}]
  }).then(function(h){
    fh = h; return hSet(h);
  }).then(function(){
    return escribirArchivo();
  }).then(function(ok){
    estadoDestino(); pintar();
    toast(ok ? "Vinculado. Desde ahora se guarda solo en ese archivo." : "Vinculado, pero no se pudo escribir todavía.");
  }).catch(function(){ /* el usuario canceló el diálogo */ });
}
function desvincular(){
  fh = null; hDel(); estadoDestino(); pintar();

}

var guardando = 0;

/* ══════════════════════════════════════════════════════════ 4 · CÁLCULOS ══ */
function totMov(m){ return (+m.neto||0) * (1 + (+m.iva||0)); }
function saldoLinea(x){ return (+x.monto||0) - (+x.pago||0); }
function estadoLinea(x){
  if(saldoLinea(x) <= 0) return "saldado";
  return (x.venc && dias(x.venc, hoy()) > 0) ? "vencido" : "vigente";
}
function diasVenc(x){
  if(saldoLinea(x) <= 0 || !x.venc) return 0;
  return Math.max(0, dias(x.venc, hoy()));
}
function meses(){
  var out = [], ini = S.empresa.inicio || hoy();
  for(var i=0;i<12;i++){ var f = addMes(ini, i); out.push({iso:f, per:per(f), lbl:MESES[+f.slice(5,7)-1] + " " + f.slice(2,4)}); }
  return out;
}
function flujo(){
  var ms = meses();
  var mapa = {};
  S.mov.forEach(function(m){
    var k = per(m.fecha) + "|" + m.rubro;
    mapa[k] = (mapa[k]||0) + totMov(m);
  });
  function fila(rubro){ return ms.map(function(x){ return mapa[x.per + "|" + rubro] || 0; }); }
  var ing = S.rubrosI.map(function(r){ return {r:r, v:fila(r)}; });
  var egr = S.rubrosE.map(function(r){ return {r:r, v:fila(r)}; });
  var tI = ms.map(function(_,i){ return ing.reduce(function(a,f){ return a+f.v[i]; },0); });
  var tE = ms.map(function(_,i){ return egr.reduce(function(a,f){ return a+f.v[i]; },0); });
  var res = tI.map(function(v,i){ return v - tE[i]; });
  var ini = [], fin = [];
  res.forEach(function(v,i){ ini[i] = i===0 ? (+S.empresa.saldoInicial||0) : fin[i-1]; fin[i] = ini[i] + v; });
  return {ms:ms, ing:ing, egr:egr, tI:tI, tE:tE, res:res, ini:ini, fin:fin};
}
function caja(){
  var s = +S.empresa.saldoInicial || 0;
  S.mov.forEach(function(m){ s += (m.tipo === "Ingreso" ? 1 : -1) * totMov(m); });
  return s;
}
function pe(){
  var cf = S.costeo.fijos.reduce(function(a,f){ return a + (+f.monto||0); }, 0);
  var mc = (+S.costeo.precio||0) - (+S.costeo.cv||0);
  var mcp = S.costeo.precio > 0 ? mc / S.costeo.precio : 0;
  return {cf:cf, mc:mc, mcp:mcp,
          unid: mc > 0 ? Math.ceil(cf/mc) : 0,
          fact: mcp > 0 ? cf/mcp : 0,
          vend: +S.costeo.unidades || 0};
}
/* Modo personal: los mismos campos del costeo se reinterpretan.
   precio = ingreso mensual · cv = gastos variables · unidades = ahorros. */
function presu(){
  var cf = S.costeo.fijos.reduce(function(a,x){ return a + (+x.monto||0); }, 0);
  var ing = +S.costeo.precio || 0, va = +S.costeo.cv || 0, ah = +S.costeo.unidades || 0;
  var gasto = cf + va, sobra = ing - gasto;
  return {cf:cf, ing:ing, varm:va, ahorro:ah, gasto:gasto, sobra:sobra,
          tasa: ing > 0 ? sobra/ing : 0, colchon: gasto > 0 ? ah/gasto : 0};
}
function aging(lista){
  var r = {vigente:0, d30:0, d60:0, d90:0, mas:0, total:0};
  lista.forEach(function(x){
    var s = saldoLinea(x); if(s <= 0) return;
    r.total += s;
    var d = diasVenc(x);
    if(d === 0) r.vigente += s;
    else if(d <= 30) r.d30 += s;
    else if(d <= 60) r.d60 += s;
    else if(d <= 90) r.d90 += s;
    else r.mas += s;
  });
  return r;
}

function diasCopia(){
  if(!S.ultimaCopia) return 999;
  try{ return Math.abs(dias(S.ultimaCopia, hoy())); }catch(e){ return 999; }
}
function avisoCopia(){
  var hay = S.mov.length || S.cobrar.length || S.pagar.length;
  if(fh || !hay || diasCopia() < 7) return "";
  return '<div class="aviso"><span><b>Tus datos viven solo en este navegador.</b> ' +
    'Si limpiás los datos de navegación, se pierden.</span>' +
    '<span style="display:flex;gap:.4rem;flex-wrap:wrap">' +
      (soportaFS ? '<button class="btn btn-1 btn-sm" data-vincular>Guardar en un archivo</button>' : '') +
      '<button class="btn btn-2 btn-sm" data-export>Exportar copia</button></span></div>';
}
function pintar(){
  $("#empName").textContent = S.empresa.nombre || (S.modo === "personal" ? "Sin nombre" : "Sin nombre de empresa");
  $("#main").innerHTML = avisoCopia() +
    ({panel:vPanel, mov:vMov, cobrar:vCobrar, pagar:vPagar,
      flujo:vFlujo, costeo:vCosteo, config:vConfig, datos:vDatos})[actual]();
  estadoDestino();
}

/* ───────────────────────────────────────────────────────────────── PANEL ── */
function vPanel(){
  var f = flujo(), c = caja(), p = pe();
  var pc = aging(S.cobrar), pp = aging(S.pagar);
  var hoyPer = per(hoy());
  var idx = f.ms.map(function(m){ return m.per; }).indexOf(hoyPer);
  var resMes = idx >= 0 ? f.res[idx] : 0;
  var vencC = pc.d30 + pc.d60 + pc.d90 + pc.mas;
  var ratio = pc.total > 0 ? vencC / pc.total : 0;
  var prox = S.pagar.reduce(function(a,x){
    var s = saldoLinea(x);
    return a + ((s > 0 && x.venc && dias(hoy(), x.venc) >= 0 && dias(hoy(), x.venc) <= 7) ? s : 0);
  }, 0);

  if(!S.mov.length && !S.cobrar.length && !S.pagar.length){
    return '<section class="view"><div class="vhead"><div><h2>Panel</h2>' +
      '<p>Todavía no hay nada cargado. El sistema se alimenta de una sola cosa: los movimientos del día.</p></div></div>' +
      '<div class="card"><div class="empty"><b>Empezá por acá</b>' +
      'Cargá tu primer movimiento en la pestaña Movimientos, o probá el sistema con datos de ejemplo desde Datos.' +
      '<div style="display:flex;gap:.5rem;justify-content:center;margin-top:1.1rem;flex-wrap:wrap">' +
      '<button class="btn btn-1" data-go="mov">Cargar un movimiento</button>' +
      '<button class="btn btn-2" data-demo>Probar con datos de ejemplo</button></div></div></div></section>';
  }

  // Eje en cero: los meses positivos suben, los negativos bajan. Misma escala en las dos mitades.
  var maxAbs = Math.max.apply(null, f.res.map(Math.abs).concat([1]));
  var barras = f.res.map(function(v,i){
    var h = v ? Math.max(3, Math.abs(v)/maxAbs*100) : 0;
    return '<div class="b" title="'+esc(f.ms[i].lbl+': '+money(v))+'">' +
      '<div class="u">'+(v > 0 ? '<i style="height:'+h+'%"></i>' : '')+'</div>' +
      '<div class="d">'+(v < 0 ? '<i style="height:'+h+'%"></i>' : '')+'</div>' +
      '<span>'+f.ms[i].lbl.slice(0,3)+'</span></div>';
  }).join("");

  function sem(txt, ok){
    return '<div class="sem-row"><span>'+txt+'</span><span class="pill '+(ok?"ok":"bad")+'">'+(ok?"OK":"Alerta")+'</span></div>';
  }
  var minFin = Math.min.apply(null, f.fin);
  var esPer = S.modo === "personal";
  var pres = presu();

  var alertas = S.cobrar.filter(function(x){ return diasVenc(x) > 0; })
    .sort(function(a,b){ return diasVenc(b) - diasVenc(a); }).slice(0,4);

  return '<section class="view">' +
    '<div class="vhead"><div><h2>Panel</h2><p>Los números que mirás una vez por semana.</p></div>' +
      '<div class="tools"><button class="btn btn-2 btn-sm" data-print>Imprimir informe</button></div></div>' +

    '<div class="kpis">' +
      kpi("Saldo de caja", money(c), c>=0?"pos":"neg", "Inicial más todo lo cargado") +
      kpi("Resultado del mes", money(resMes), resMes>=0?"pos":"neg", MESES[new Date().getMonth()]) +
      kpi(esPer ? "Te deben y está vencido" : "Cartera vencida", money(vencC), vencC>0?"neg":"",
          pc.total>0 ? pct(ratio)+" del total" : "Nada pendiente") +
      kpi("Vence esta semana", money(prox), prox>0?"neg":"", esPer ? "Cuotas y deudas" : "Cuentas por pagar") +
    '</div>' +

    '<div class="two">' +
      '<div class="card"><div class="card-h"><h3>Resultado mensual proyectado</h3>' +
        '<span class="lbl">12 meses desde '+f.ms[0].lbl+'</span></div>' +
        '<div class="card-b"><div class="bars">'+barras+'</div></div></div>' +
      '<div class="card"><div class="card-h"><h3>Semáforo</h3></div><div class="card-b"><div class="sem">' +
        sem(esPer ? "No te quedás sin plata en 12 meses" : "Caja positiva los 12 meses", minFin >= 0) +
        sem(esPer ? "Te deben poco y no hace mucho" : "Cartera vencida bajo 20%", ratio < 0.2) +
        sem(esPer ? "Te deben más de lo que debés" : "Cobrás más de lo que debés", pc.total >= pp.total) +
        (esPer ? sem("Gastás menos de lo que ganás", pres.sobra > 0)
               : sem("Superás el punto de equilibrio", p.vend >= p.unid && p.unid > 0)) +
      '</div></div></div>' +
    '</div>' +

    (alertas.length ?
      '<div class="card"><div class="card-h"><h3>Lo más vencido</h3><span class="lbl">A reclamar hoy</span></div>' +
      '<div class="tw"><table><thead><tr><th>'+esc(L().quienC)+'</th><th>Comprobante</th><th>Venció</th><th class="r">Saldo</th></tr></thead><tbody>' +
      alertas.map(function(x){
        return '<tr><td>'+esc(x.nombre)+'</td><td class="mono">'+esc(x.comp||"—")+'</td>' +
          '<td><span class="pill bad">hace '+diasVenc(x)+' días</span></td>' +
          '<td class="r mono">'+money(saldoLinea(x))+'</td></tr>';
      }).join("") + '</tbody></table></div></div>' : "") +
  '</section>';
}
function kpi(t, v, cls, sub){
  return '<div class="kpi"><span>'+t+'</span><b class="'+(cls||"")+'">'+v+'</b><small>'+esc(sub)+'</small></div>';
}

/* ─────────────────────────────────────────────────────────── MOVIMIENTOS ── */
function vMov(){
  var pers = {};
  S.mov.forEach(function(m){ pers[per(m.fecha)] = m.fecha.slice(0,7); });
  var lista = Object.keys(pers).sort().reverse();

  var filas = S.mov.filter(function(m){
    if(filtro.per && String(per(m.fecha)) !== filtro.per) return false;
    if(filtro.tipo && m.tipo !== filtro.tipo) return false;
    if(filtro.q){
      var t = (m.rubro+" "+m.detalle+" "+m.medio).toLowerCase();
      if(t.indexOf(filtro.q.toLowerCase()) === -1) return false;
    }
    return true;
  }).sort(function(a,b){ return a.fecha < b.fecha ? 1 : -1; });

  var tI = filas.reduce(function(a,m){ return a + (m.tipo==="Ingreso" ? totMov(m) : 0); }, 0);
  var tE = filas.reduce(function(a,m){ return a + (m.tipo==="Egreso" ? totMov(m) : 0); }, 0);

  var cuerpo = filas.length ? filas.map(function(m){
    return '<tr><td class="mono">'+fmtF(m.fecha)+'</td>' +
      '<td><span class="pill '+(m.tipo==="Ingreso"?"ok":"mut")+'">'+m.tipo+'</span></td>' +
      '<td>'+esc(m.rubro)+'</td><td style="color:var(--muted)">'+esc(m.detalle||"—")+'</td>' +
      '<td style="color:var(--muted)">'+esc(m.medio||"—")+'</td>' +
      (L().iva ? '<td class="r mono">'+money(m.neto)+'</td><td class="r mono" style="color:var(--dim)">'+pct(m.iva)+'</td>' : '') +
      '<td class="r mono '+(m.tipo==="Ingreso"?"pos":"")+'">'+money(totMov(m))+'</td>' +
      '<td><div class="row-act">' +
        '<button class="btn btn-3 btn-sm" data-edit-mov="'+m.id+'">Editar</button>' +
        '<button class="btn btn-3 btn-sm" data-del-mov="'+m.id+'">Borrar</button></div></td></tr>';
  }).join("") : '<tr><td colspan="'+(L().iva?9:7)+'"><div class="empty"><b>Sin movimientos</b>Cargá el primero con el botón de arriba.</div></td></tr>';

  return '<section class="view">' +
    '<div class="vhead"><div><h2>Movimientos</h2>' +
      '<p>Todo lo que entra y todo lo que sale. Es la única carga manual del sistema: el resto se calcula solo.</p></div>' +
      '<div class="tools"><button class="btn btn-1" data-new-mov>+ Nuevo movimiento</button></div></div>' +

    '<div class="filters">' +
      '<select class="inp" id="fPer"><option value="">Todos los meses</option>' +
        lista.map(function(p){ var y=p.slice(0,4), m=+p.slice(5,7);
          return '<option value="'+p.replace("-","")+'"'+(filtro.per===p.replace("-","")?" selected":"")+'>'+MESES[m-1]+" "+y+'</option>'; }).join("") +
      '</select>' +
      '<select class="inp" id="fTipo"><option value="">Ingresos y egresos</option>' +
        '<option'+(filtro.tipo==="Ingreso"?" selected":"")+'>Ingreso</option>' +
        '<option'+(filtro.tipo==="Egreso"?" selected":"")+'>Egreso</option></select>' +
      '<input class="inp" id="fQ" placeholder="Buscar rubro o detalle" value="'+esc(filtro.q)+'">' +
      (filtro.per||filtro.tipo||filtro.q ? '<button class="btn btn-3 btn-sm" data-clear>Limpiar</button>' : '') +
    '</div>' +

    '<div class="card"><div class="tw"><table>' +
      '<thead><tr><th>Fecha</th><th>Tipo</th><th>Rubro</th><th>Detalle</th><th>Medio</th>' +
        (L().iva ? '<th class="r">Neto</th><th class="r">IVA</th>' : '') +
        '<th class="r">Total</th><th></th></tr></thead>' +
      '<tbody>'+cuerpo+'</tbody>' +
      (filas.length ? '<tfoot><tr><td colspan="'+(L().iva?5:3)+'">'+filas.length+' movimientos</td>' +
        '<td class="r" colspan="2">Ingresos '+money(tI)+'</td>' +
        '<td class="r">Egresos '+money(tE)+'</td><td></td></tr></tfoot>' : '') +
    '</table></div></div></section>';
}

        ? fld("IVA","<select class='inp' id='mIva'>" +

            "</select>") +
          '<div class="fld"><label>Total</label><input class="inp num" id="mTot" readonly tabindex="-1"></div>'

  function sync(){

    $("#mRubro").innerHTML = opts(r, r.indexOf(prev) >= 0 ? prev : r[0]);

  $("#mTipo").addEventListener("change", function(){ sync(); });

             detalle: val("mDet"), medio: $("#mMedio").value, neto: nval("mNeto"), iva: +$("#mIva").value || 0};
    if(m){ S.mov[S.mov.map(function(x){return x.id;}).indexOf(m.id)] = o; } else { S.mov.push(o); }
    guardar(); cerrar(); pintar(); toast(m ? "Movimiento actualizado." : "Movimiento cargado.");

}
function fld(label, control, cls){

}

/* ────────────────────────────────────────────────────────────────── FLUJO ── */

      fila("Total ingresos", f.tI, "tot") +
      '<tr class="sec"><td colspan="13">Egresos</td></tr>' +
      (egr.length ? egr.map(function(r){ return fila(r.r, r.v); }).join("")
                  : '<tr><td colspan="13" style="color:var(--dim);padding:.9rem 1.1rem">Sin egresos cargados</td></tr>') +
      fila("Total egresos", f.tE, "tot") +
      '<tr class="sec"><td colspan="13">Resultado y caja</td></tr>' +
      fila("Resultado del mes", f.res, "tot", true) +
      fila("Saldo al inicio", f.ini, "", true) +
      fila("Saldo al cierre", f.fin, "fin", true) +
    '</tbody></table></div></div>' +

    (Math.min.apply(null, f.fin) < 0 ?
      '<div class="note">Hay al menos un mes con el saldo de caja en negativo. Ese es el mes en que te quedás sin plata: actuá con dos meses de anticipación, no cuando llega.</div>' : '') +
  '</section>';
}

/* ───────────────────────────────────────────────────────────────── COSTEO ── */
function vCosteo(){ return S.modo === "personal" ? vPresupuesto() : vCosteoPyme(); }

function vPresupuesto(){
  var b = presu();
  var diag = b.ing <= 0
    ? "Cargá tu ingreso mensual para ver el resto."
    : b.sobra > 0

/* ═════════════════════════════════════════════════════════ 7 · ACCIONES ══ */
$("#main").addEventListener("click", function(e){
  var t = e.target, b = t.closest ? t.closest("button,a") : null;
  if(!b) return;
  var g;
  if(b.hasAttribute("data-new-mov")) return formMov();
  if((g = b.getAttribute("data-edit-mov"))) return formMov(g);
  if((g = b.getAttribute("data-del-mov"))) {
    return confirmar("Borrar movimiento", "Esta acción no se puede deshacer.", function(){
      S.mov = S.mov.filter(function(x){ return x.id !== g; }); guardar(); pintar(); toast("Movimiento borrado.");
    });
  }
  if((g = b.getAttribute("data-new-lin"))) return formLinea(g);
  if((g = b.getAttribute("data-edit-lin"))) { g = g.split(":"); return formLinea(g[0], g[1]); }
  if((g = b.getAttribute("data-del-lin"))) {
    var p = g.split(":");
    return confirmar("Borrar factura", "Esta acción no se puede deshacer.", function(){
      if(p[0] === "cobrar") S.cobrar = S.cobrar.filter(function(x){ return x.id !== p[1]; });
      else S.pagar = S.pagar.filter(function(x){ return x.id !== p[1]; });
      guardar(); pintar(); toast("Factura borrada.");
    });
  }
  if((g = b.getAttribute("data-saldar"))) {
    var q = g.split(":"), arr = q[0] === "cobrar" ? S.cobrar : S.pagar;
    var x = arr.filter(function(o){ return o.id === q[1]; })[0];
    if(x){ x.pago = x.monto; guardar(); pintar(); toast(q[0] === "cobrar" ? "Marcada como cobrada." : "Marcada como pagada."); }
    return;
  }
  if(b.hasAttribute("data-add-fijo")) {
    S.costeo.fijos.push({id:uid(), nombre:"Nuevo costo fijo", monto:0}); guardar(); pintar(); return;
  }
  if((g = b.getAttribute("data-del-fijo"))) {
    S.costeo.fijos = S.costeo.fijos.filter(function(x){ return x.id !== g; }); guardar(); pintar(); return;
  }
  if((g = b.getAttribute("data-del-rub"))) {
    var r = g.split(":"); S[r[0]].splice(+r[1], 1); guardar(); pintar(); return;
  }
  if((g = b.getAttribute("data-add-rub"))) {
    var inp = $('[data-add-in="'+g+'"]'), v = inp.value.trim();
    if(!v) return toast("Escribí un nombre primero.");
    if(S[g].indexOf(v) >= 0) return toast("Ese ya existe.");
    S[g].push(v); guardar(); pintar(); return;
  }
  if((g = b.getAttribute("data-go"))) { actual = g; tabs(); pintar(); return; }
  if(b.hasAttribute("data-clear")) { filtro = {per:"",tipo:"",q:""}; pintar(); return; }
  if(b.hasAttribute("data-vincular")) return vincular();
  if(b.hasAttribute("data-desvincular")) return desvincular();
  if((g = b.getAttribute("data-modo"))) return cambiarModo(g);
  if(b.hasAttribute("data-print")) return imprimir();
  if(b.hasAttribute("data-export")) return exportar();
  if(b.hasAttribute("data-import")) return importar();
  if(b.hasAttribute("data-demo")) return demo();
  if(b.hasAttribute("data-wipe")) {
    return confirmar("Borrar todo", "Se borran todos los movimientos, facturas y configuraciones de este navegador. Exportá una copia antes si no estás seguro.", function(){
      S = vacio(); ls(DKEY, null); guardar(); actual = "panel"; tabs(); pintar(); toast("Todo borrado.");
    }, "Sí, borrar todo");
  }
});

$("#main").addEventListener("input", function(e){
  var t = e.target, g;
  if(t.id === "fQ"){ filtro.q = t.value; var p = t.selectionStart; pintar(); var n = $("#fQ"); if(n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if((g = t.getAttribute("data-fijo-n"))){ setFijo(g,"nombre",t.value); return; }
  if((g = t.getAttribute("data-fijo-m"))){ setFijo(g,"monto",+t.value||0); return; }
  if(t.id === "cPrecio"){ S.costeo.precio = +t.value||0; return guardar(); }
  if(t.id === "cCv"){ S.costeo.cv = +t.value||0; return guardar(); }
  if(t.id === "cUn"){ S.costeo.unidades = +t.value||0; return guardar(); }
  var mapa = {eNom:"nombre", eCuit:"cuit", eAct:"actividad", eJur:"jur", eIni:"inicio"};
  if(mapa[t.id]){ S.empresa[mapa[t.id]] = t.value; $("#empName").textContent = S.empresa.nombre || "Sin nombre de empresa"; return guardar(); }
  if(t.id === "eSal"){ S.empresa.saldoInicial = +t.value||0; return guardar(); }
});
function setFijo(id, campo, v){
  var f = S.costeo.fijos.filter(function(x){ return x.id === id; })[0];
  if(f){ f[campo] = v; guardar(); }
}
$("#main").addEventListener("change", function(e){
  var t = e.target;
  if(t.id === "fPer"){ filtro.per = t.value; return pintar(); }
  if(t.id === "fTipo"){ filtro.tipo = t.value; return pintar(); }
  if(t.id === "eIva"){ S.empresa.iva = t.value; return guardar(); }
  if(t.id === "eIni"){ S.empresa.inicio = t.value; guardar(); return pintar(); }
  if(t.id === "cPrecio" || t.id === "cCv" || t.id === "cUn") return pintar();
});
$("#main").addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-add-in")){
    var k = e.target.getAttribute("data-add-in"), v = e.target.value.trim();
    if(v && S[k].indexOf(v) < 0){ S[k].push(v); guardar(); pintar(); }
  }
});

document.addEventListener("click", function(e){
  if(e.target.closest && e.target.closest("#dest")){ actual = "datos"; tabs(); pintar(); window.scrollTo({top:0,behavior:"smooth"}); }
});

/* ═══════════════════════════════════════════════════════ CAMBIO DE MODO ══ */
function cambiarModo(modo){
  if(modo === S.modo) return;
  var m = MODOS[modo];
  modal("Cambiar a modo " + m.etiqueta,
    '<p style="font-size:.88rem;color:var(--muted)">No se borra ningún movimiento ni ninguna factura. ' +
    'Cambian los nombres de las pestañas y los rubros que te ofrece el sistema.</p>' +
    '<div class="fld"><label>Rubros</label>' +
      '<select class="inp" id="mdRub">' +
        '<option value="reemplazar">Usar los rubros de ' + esc(m.etiqueta) + ' (recomendado)</option>' +
        '<option value="sumar">Agregar los de ' + esc(m.etiqueta) + ' a los que ya tengo</option>' +
        '<option value="dejar">Dejar mis rubros como están</option>' +
      '</select>' +
      '<span class="hint">Si ya cargaste movimientos con tus rubros actuales, elegí "agregar" o "dejar" para no perder el agrupamiento.</span></div>',
    '<button class="btn btn-2" data-x>Cancelar</button><button class="btn btn-1" id="mdOk">Cambiar</button>');

  $("#mdOk").addEventListener("click", function(){
    var q = $("#mdRub").value;
    S.modo = modo;
    if(q === "reemplazar"){ S.rubrosI = m.rubrosI.slice(); S.rubrosE = m.rubrosE.slice(); S.medios = m.medios.slice(); }
    else if(q === "sumar"){
      [["rubrosI","rubrosI"],["rubrosE","rubrosE"],["medios","medios"]].forEach(function(k){
        m[k[1]].forEach(function(r){ if(S[k[0]].indexOf(r) < 0) S[k[0]].push(r); });
      });
    }
    if(!m.iva){ S.mov.forEach(function(x){ x.iva = 0; }); }
    guardar(); cerrar(); actual = "panel"; tabs(); pintar();
    toast("Listo, ahora estás en modo " + m.etiqueta + ".");
  });
}

/* ═════════════════════════════════════════════ 8 · EXPORTAR / IMPORTAR ══ */
function exportar(){
  var txt = JSON.stringify(S, null, 1);
  var nom = "fayer-" + (S.empresa.nombre || "empresa").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + hoy() + ".json";
  modal("Copia de seguridad",
    '<p style="font-size:.86rem;color:var(--muted)">Descargá el archivo, o copiá el texto y guardalo donde prefieras. ' +
    'Los dos caminos sirven para restaurar.</p>' +
    '<textarea class="inp" id="expTxt" rows="7" readonly style="font-family:var(--f-mono);font-size:.72rem">'+esc(txt)+'</textarea>' +
    '<p style="font-size:.76rem;color:var(--dim)">'+nom+' · '+ARS.format(Math.round(txt.length/1024))+' KB</p>',
    '<button class="btn btn-2" id="expCopy">Copiar al portapapeles</button>' +
    '<button class="btn btn-1" id="expDl">Descargar archivo</button>');

  $("#expCopy").addEventListener("click", function(){
    var ta = $("#expTxt"); ta.select();
    var ok = false;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ S.ultimaCopia = hoy(); guardar(); toast("Copiado."); },
        function(){ toast("Seleccioná el texto y copialo con Ctrl+C."); });
      return;
    }
    try{ ok = document.execCommand("copy"); }catch(e){}
    toast(ok ? "Copiado." : "Seleccioná el texto y copialo con Ctrl+C.");
  });
  $("#expDl").addEventListener("click", function(){
    try{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      a.download = nom; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
      S.ultimaCopia = hoy(); guardar();
      toast("Archivo descargado.");
    }catch(e){ toast("Este navegador bloqueó la descarga: copiá el texto."); }
  });
}
function importar(){
  modal("Importar copia",
    '<p style="font-size:.86rem;color:var(--muted)">Elegí un archivo exportado antes, o pegá el texto. ' +
    '<b style="color:var(--text)">Reemplaza todo lo que tengas cargado ahora.</b></p>' +
    '<input class="inp" type="file" id="impFile" accept="application/json,.json">' +
    '<textarea class="inp" id="impTxt" rows="7" placeholder="…o pegá el contenido acá" style="font-family:var(--f-mono);font-size:.72rem"></textarea>',
    '<button class="btn btn-2" data-x>Cancelar</button><button class="btn btn-1" id="impOk">Importar</button>');

  $("#impFile").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ $("#impTxt").value = rd.result; };
    rd.readAsText(f);
  });
  $("#impOk").addEventListener("click", function(){
    var raw = $("#impTxt").value.trim();
    if(!raw) return toast("No hay nada para importar.");
    var d;
    try{ d = JSON.parse(raw); }catch(e){ return toast("El archivo no es un JSON válido."); }
    if(!d || !d.empresa || !Array.isArray(d.mov)) return toast("Ese archivo no es una copia de Fayer.");
    S = Object.assign(vacio(), d);
    guardar(); cerrar(); actual = "panel"; tabs(); pintar(); toast("Copia importada.");
  });
}

/* ══════════════════════════════════════════════════════════ 10 · INFORME ══ */
function imprimir(){
  var f = flujo(), p = pe(), ag = aging(S.cobrar), agp = aging(S.pagar);
  var t = new Date();
  function tabla(head, rows){
    return '<table><thead><tr>'+head.map(function(h){ return '<th>'+h+'</th>'; }).join("")+'</tr></thead><tbody>'+rows+'</tbody></table>';
  }
  $("#print").innerHTML =
    '<h1>'+esc(S.empresa.nombre || "Informe financiero")+'</h1>' +
    '<p class="meta">'+esc(S.empresa.cuit ? "CUIT "+S.empresa.cuit+" · " : "")+
      'Informe generado el '+String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0")+"/"+t.getFullYear()+'</p>' +

    '<h2>Situación general</h2>' +
    tabla(["Concepto","Valor"],
      [[S.modo === "personal" ? "Plata disponible" : "Saldo de caja", money(caja())],
       ["Total a cobrar", money(ag.total)],
       ["De eso, vencido", money(ag.d30+ag.d60+ag.d90+ag.mas)],
       ["Total a pagar", money(agp.total)],
       (S.modo === "personal"
          ? ["Te queda por mes", money(presu().sobra)]
          : ["Punto de equilibrio mensual", p.fact ? money(p.fact) : "No calculado"]),
       (S.modo === "personal"
          ? ["Colchón de emergencia", presu().gasto > 0 ? presu().colchon.toFixed(1).replace(".",",") + " meses" : "—"]
          : ["Unidades para no perder", p.unid ? ARS.format(p.unid) : "No calculado"])
      ].map(function(r){ return '<tr><td>'+r[0]+'</td><td style="text-align:right">'+r[1]+'</td></tr>'; }).join("")) +

    '<h2>Flujo de caja proyectado</h2>' +
    tabla(["Mes","Ingresos","Egresos","Resultado","Saldo al cierre"],
      f.ms.map(function(m,i){
        return '<tr><td>'+m.lbl+'</td><td style="text-align:right">'+money(f.tI[i])+'</td>' +
          '<td style="text-align:right">'+money(f.tE[i])+'</td>' +
          '<td style="text-align:right">'+money(f.res[i])+'</td>' +
          '<td style="text-align:right">'+money(f.fin[i])+'</td></tr>';
      }).join("")) +

    '<h2>' + (S.modo === "personal" ? "Antigüedad de lo que te deben" : "Antigüedad de la deuda a cobrar") + '</h2>' +
    tabla(["Tramo","Importe"],
      [["Vigente",ag.vigente],["Vencido 1 a 30 días",ag.d30],["Vencido 31 a 60",ag.d60],
       ["Vencido 61 a 90",ag.d90],["Más de 90 días",ag.mas],["Total",ag.total]]
      .map(function(r){ return '<tr><td>'+r[0]+'</td><td style="text-align:right">'+money(r[1])+'</td></tr>'; }).join("")) +

    '<p class="meta" style="margin-top:18pt">Generado con Sistema Fayer · fayer.site · ' +
    'Este informe es de gestión interna y no reemplaza la contabilidad formal ni el asesoramiento de un contador matriculado.</p>';

  setTimeout(function(){ window.print(); }, 60);
}

function elegirModo(){
  modal("¿Para qué lo vas a usar?",
    '<p style="font-size:.88rem;color:var(--muted)">Podés cambiarlo cuando quieras desde Configuración. ' +
    'Esto solo decide los nombres y los rubros con los que arrancás.</p>' +

      '<button data-modo-ini="pyme"><b>Mi empresa</b><span>Rubros de PyME, IVA, clientes y proveedores, punto de equilibrio.</span></button>' +
      '<button data-modo-ini="personal"><b>Mis finanzas</b><span>Sueldo y gastos del hogar, sin IVA, presupuesto y colchón de emergencia.</span></button>' +
    '</div>', '');
  M.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-modo-ini]") : null;
    if(!b) return;
    S = vacio(b.getAttribute("data-modo-ini"));
    guardar(); cerrar(); tabs(); pintar();
  });
}

function boot(){
  var hab = cargar();
  tabs(); pintar();
  // Si hay un archivo vinculado, ese archivo manda: sobrevive a limpiar el navegador.
  hGet().then(function(h){
    if(!h) return;
    if(!h.queryPermission) return;
    return h.queryPermission({mode:"readwrite"}).then(function(p){
      if(p !== "granted") return;
      fh = h;
      return h.getFile().then(function(file){ return file.text(); }).then(function(t){
        var d = JSON.parse(t);
        if(d && d.empresa && Array.isArray(d.mov)){ S = Object.assign(vacio(d.modo || "pyme"), d); }
        estadoDestino(); tabs(); pintar();
      }).catch(function(){ estadoDestino(); });
    });
  }).catch(function(){}).then(function(){
    if(!hab && !fh) elegirModo();
  });
}
if(ls(AKEY) === "1"){ abrir(); }
})();
